<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Bienestar Animal / Evalución para Ganadería">
<meta name="author" content="MAGICMV, willigan">
<title>Resultado - Evaluación - Bienestar Animal</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">

<!--Font Awesome-->
<link rel="stylesheet" th:href="@{/css/font-awesome/all.min.css}">

<!-- GOOGLE WEB FONT -->
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">

</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
		<div class="container">
			<a class="navbar-brand" href="#">Bienestar Animal</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" th:href="@{/inicio-contenido}">Inicio</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/finca/listar}">Finca</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/evaluacion/listar}">Evaluación</a></li>
					<li class="nav-item"><a class="nav-link">Mi perfil</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Salir</a></li>
				</ul>
			</div>
		</div>
	</nav>
	<header>
		<div class="container">
			<img src="..." alt="Imagen">
			<h1 class="text-center mb-5">Resultado de la Evaluación</h1>
		</div>

	</header>
	<main>
		<div class="container">

			<div class="row">
				<div class="col-8 mx-auto">
					<div class="row">
						<div class="col-12">
							<div class="card w-80">
								<div class="card-body">
									<h5 class="card-title">
										Ponderación Total: <a th:href="@{'/evaluacion/animales/vaca/nuevo/'+${codEc}}"> <span id="ponderacionTotal" th:text="${total}"> </span>
										</a>
									</h5>
								</div>
							</div>
						</div>
					</div>
					<br>
					<div class="row">
						<div class="col-12">
							<h6>Resultado por Libertades</h6>
							<table class="table table-striped">
								<thead>
									<tr>
										<th scope="col">Libertad</th>
										<th scope="col">Resultado</th>
									</tr>
								</thead>
								<tbody>
									<tr th:if="${list.empty}">
										<td colspan="2">Lista vacia</td>
									</tr>
									<tr th:each="obj, consec:${list}">
										<th scope="row">Libertad <span th:text="${consec.index} + 1"></span></th>
										<td><span id="ponderadoL1" th:text="${obj}"> </span></td>
									</tr>

								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	<footer class="bg-dark text-white py-3 mt-5">
		<div class="container">
			<div class="row">
				<div class="col-8">
					<p>©2022 Agrosavia</p>
				</div>
				<div class="col-4">
					<p class="text-right">Desarrollado por: magicmv.com</p>
				</div>
			</div>
		</div>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
		crossorigin="anonymous"></script>
	<!--<script src="https://kit.fontawesome.com/62ea397d3a.js" crossorigin="anonymous"></script>-->
</body>
</html>
