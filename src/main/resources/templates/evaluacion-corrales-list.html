<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description"
	content="Bienestar Animal / Evalución para Ganadería">

<title>Corrales - Evaluación - Bienestar Animal</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">

<!--Font Awesome-->
<link rel="stylesheet" th:href="@{/css/font-awesome/all.min.css}">

<!-- GOOGLE WEB FONT -->
<link
	href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap"
	rel="stylesheet">

</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
		<div class="container">
			<a class="navbar-brand" href="#">Bienestar Animal</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link"
						th:href="@{/inicio-contenido}">Inicio</a></li>
					<li class="nav-item"><a class="nav-link"
						th:href="@{/finca/listar}">Finca</a></li>
					<li class="nav-item"><a class="nav-link active"
						aria-current="page">Evaluación</a></li>
					<li class="nav-item"><a class="nav-link">Mi perfil</a></li>
					<li class="nav-item"><a class="nav-link">Salir</a></li>
				</ul>
			</div>
		</div>
	</nav>
	<header>
		<div class="container">
			<img src="..." alt="Imagen">
			<h1 class="text-center mb-5">Evaluación</h1>
		</div>

	</header>
	<main>
		<div class="container">
			<div class="row">
				<div class="col-8 mx-auto">
					<p>CORRALES</p>
					<hr>
					<p>
						Por favor aliste <span th:text="${corrales}"></span> ovinos
						para la evaluación de muestra
					</p>

					<div class="row">
						<div class="col-12">
							<div>
								<div class="card">
									<div class="card-body">
										<div th:switch="${list}" class="container my-5">
											<div class="row">
												<div class="col-sm-6 ">
													<a  
														th:href="@{'/evaluacion/animales/nuevo/'+ ${codFinca} + '/' + ${codEc}}"
														class="btn btn-primary"><i
														class="fas fa-user-plus ml-2"> Agregar corral</i></a>
												</div> 
																							
<!-- 											<div class="col-sm-6 ">
													<a  
														th:href="@{'/evaluacion/animales/nuevo/'+ ${codFinca} + '/' + ${codEc}}"
														class="btn btn-primary"><i
														class="fas fa-user-plus ml-2"> Agregar evaluación</i></a>
												</div>
 -->
												<div class="col-md-10">
													<h2 th:case="null">NO HAY MUESTRAS</h2>
													<div th:case="*">
														<table class="table table-striped table-responsive-md">
															<thead>
																<tr>
																	<th>Corral</th>
																	<th>Nombre</th>
<!-- 															    <th>Corral</th> -->
																	<th>Editar</th>
<!-- 																	<th>Eliminar</th>
 -->
																</tr>
															</thead>
															<tbody>
																<tr th:each="evco, consec : ${list}">
																	<td>Corral <span th:text="${consec.index} + 1"></span>
																	</td>
																	<td th:text="${evco.evanIdentificador}"></td>
<!-- 																	<td><a -->
<!-- 																		th:href="@{/evaluacion/animales/list/{id}(id=${evco.codEvAn})}" -->
<!-- 																		class="btn btn-primary"><i -->
<!-- 																			class="fas fa-user-edit ml-2"></i></a></td> -->
																	<td><a
																		th:href="@{/evaluacion/corrales/edit/{id}(id=${evco.id})}"
																		class="btn btn-primary"><i
																			class="fas fa-user-edit ml-2"></i></a></td>
<!-- 																	<td><a -->
<!-- 																		th:href="@{/evaluacion/corrales/delete/{id}(id=${evco.id})}" -->
<!-- 																		class="btn btn-primary"><i -->
<!-- 																			class="fas fa-user-times ml-2"></i></a></td> -->
																</tr>
															</tbody>
														</table>
													</div>
												</div>
											
											</div>
										</div>
									</div>
								</div>

							</div>
						</div>
						<br>

						<!--<button class="btn btn-primary">Volver</button>
                            <button class="btn btn-success">Siguiente: Libertad 1: libres de hambre y sed</button>-->
						<!--<a th:href="@{/inicio-contenido}" class="btn btn-primary">Cancelar</a>
                            <a th:href="@{/evaluacion-corrales}" class="btn btn-success">Siguiente: CORRALES</a>-->

					</div>
				</div>
			</div>
	</main>
	<footer class="bg-dark text-white py-3 mt-5">
		<div class="container">
			<div class="row">
				<div class="col-8">
					<p>©2022 Agrosavia</p>
				</div>
				<div class="col-4">
					<p class="text-right">Desarrollado por: magicmv.com</p>
				</div>
			</div>
		</div>
	</footer>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
		crossorigin="anonymous"></script>
	<!--<script src="https://kit.fontawesome.com/62ea397d3a.js" crossorigin="anonymous"></script>-->
</body>
</html>
