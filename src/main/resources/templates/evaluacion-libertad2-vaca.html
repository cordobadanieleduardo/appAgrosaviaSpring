        <header>
            <div class="container">
                <img src="..." alt="Imagen">
                <h1 class="text-center mb-5">Evaluación libertad 2 en vacas en producción</h1>
            </div>
           
        </header>
        <main>
            <div class="container">
                <div class="row">
                    <div class="col-8 mx-auto" >
                        <p>Libertad 2: libres de incomodidad y malestar</p>
                        <hr>
                        <form th:action="@{/evaluacion/libertad2-vaca/guardar}" th:object="${nuevo}" method="post">
                            <div class="row">
                                <div class="col-12">
                                
                                	<input type="hidden" th:field="*{codEc}" th:value="*{codEc}">
                                	<input type="hidden" th:field="*{codElvaca}" th:value="*{codElvaca}">
                                	                                    
                                    <label class="form-label"><span class="apuntes">[elv_q01] x7</span> ¿Hay presencia de objetos extraños o peligrosos en la pradera (puntillas, alambres, plásticos, costales, lazos y  tarros)?</label>
                                    <select th:field="*{el2Q01}" name="" id="" class="form-select" required>
                                        <option value="" selected  >Seleccionar...</option>
                                        <option th:value="10">Ninguno</option>
                                        <option th:value="3">Pocos</option>
                                        <option th:value="1">Muchos</option>
                                    </select>

                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q02] x7</span> ¿Hay encharcamiento de la pradera?</label>
                                    <select th:field="*{el2Q02}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">No existe encharcamiento</option>
                                        <option th:value="2">Existe encharcamiento </option>
                                    </select>

                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q03] x7</span> ¿Cúal es tipo de sombra que ofrece a los animales en la pradera?</label>
                                    <select th:field="*{el2Q03}" name="" id="" class="form-select" required>
                                        <option value="" selected  > Seleccionar...</option>  
                                        <option th:value="10">Se brindan zonas de sombras de tipo natural</option>
                                        <option th:value="7">Se brindan zonas de sombras de tipo artificial </option>
                                        <option th:value="1">No se brindan zonas de sombranatural</option>
                                    </select>

                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q04] x7</span> ¿Hay limpieza del área preordeño?</label>
                                    <select th:field="*{el2Q04}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Limpio</option>
                                        <option th:value="5">Regular</option>
                                        <option th:value="1">Sucio</option>
                                        <option th:value="1">No hay</option>
                                    </select>

                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q05] x7</span> ¿Hay limpieza del sitio de ordeño?</label>
                                    <select th:field="*{el2Q05}" name="" id="" class="form-select" required>
                                        <option value="" selected  >Seleccionar...</option>
                          			    <option th:value="10">Limpios</option>
                                        <option th:value="5">Regulares</option>
                                        <option th:value="1">Sucios</option>
                                    </select>

                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q06] x7</span> ¿Hay ruido en la sala de ordeño?</label>
                                    <select th:field="*{el2Q06}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Aceptables (Dos personas conversando en baja voz)</option>
                                        <option th:value="4">Inaceptables (Dos personas conversando a gritos)</option>
                                    </select>
                                    
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q07] x5</span> ¿Hay disponibilidad de sombra en el patio preordeño?</label>
                                    <select th:field="*{el2Q07}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Si</option>
                                        <option th:value="1">No</option>
                                    </select>
                                    
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q08] x5</span> ¿Hay disponibilidad de agua en el patio preordeño?</label>
                                    <select th:field="*{el2Q08}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Si</option>
                                        <option th:value="1">No</option>
                                    </select>
                                    
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q09] x7</span> ¿Cúal es la condición de los caminos?</label>
                                    <select th:field="*{el2Q09}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Buena</option>
                                        <option th:value="5">Regular</option>
                                        <option th:value="1">Mala</option>
                                        <option th:value="1">No hay caminos</option>
                                    </select>
                                    
                                    
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q10] x7</span> ¿Cúal es el tipo de superficie del corral?</label>
                                    <select th:field="*{el2Q10}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="3">Balastro</option>
                                        <option th:value="3">Tierra</option>
                                        <option th:value="5">Concreto</option>
                                        <option th:value="10">Superficies de cucho</option>
                                    </select>
                                    
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q11] x7</span> ¿Existencia del brete?</label>
                                    <select th:field="*{el2Q11}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Si</option>
                                        <option th:value="1">No</option>
                                    </select>
                                    
                      
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q12] x7</span> ¿Existencia de la manga?</label>
                                    <select th:field="*{el2Q12}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Si</option>
                                        <option th:value="1">No</option>
                                    </select>
                                    
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q13] x7</span> ¿Existencia de sombra en el corral?</label>
                                    <select th:field="*{el2Q13}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Si</option>
                                        <option th:value="1">No</option>
                                    </select>
                                    
                                    <br>
                                    <label class="form-label"><span class="apuntes">[elv_q14] x7</span> ¿Existencia de bebedero(s) en el corral?</label>
                                    <select th:field="*{el2Q14}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Si</option>
                                        <option th:value="1">No</option>
                                    </select>
                                    
                                     <br>
                                    <label class="form-label"><span class="apuntes">[elv_q15] x7</span> ¿Cuál es la condición de los corrales?</label>
                                    <select th:field="*{el2Q15}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Bueno</option>
                                        <option th:value="5">Regular</option>
                                        <option th:value="1">Mala</option>
                                        <option th:value="1">No tiene</option>
                                    </select>
                                    
                                     <br>
                                    <label class="form-label"><span class="apuntes">[elv_q16] x7</span> ¿Cuál es la limpieza de los corrales?</label>
                                    <select th:field="*{el2Q16}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Limpio</option>
                                        <option th:value="5">Regular</option>
                                        <option th:value="1">Sucio</option>
                                    </select>
                                    
                                     
                                     <br>
                                    <label class="form-label"><span class="apuntes">[elv_q17] x5</span> ¿Cuál es la condición del embarcadero?</label>
                                    <select th:field="*{el2Q17}" name="" id="" class="form-select" required>
                                        <option value="0" selected  >Seleccionar...</option>
                                        <option th:value="10">Bueno</option>
                                        <option th:value="5">Regular</option>
                                        <option th:value="1">Malo</option>
                                        <option th:value="1">No hay</option>
                                    </select>
                                </div>       
                            </div>
                            <br>
<!--                            <button class="btn btn-primary">Volver</button> -->
<!--                             <a class="btn btn-primary" th:href="@{'/evaluacion/libertad2-vaca/'+ *{el1vaca}}" >Volver</a> -->
                           
                            <button type="submit" class="btn btn-success">Siguiente: Libertad 3 en Vaca</button>
                        </form>
                    </div>
                </div>
            </div> 
        </main>

                    <div class="col-8">
